<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a drafting-sheet textbook. Fixed chapter rail on the left (desktop), one ~68ch reading column,
   one chapter shown at a time. Chapter openers are styled like an architectural drawing's title block. */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --surface2:#ECEFF4; --ink:#17202B; --ink2:#4B5667; --line:#D3D9E2;
  --accent:#2A50C8; --accent-soft:#E2E9FB; --accent-ink:#1D3A94;
  --warn:#9A5A08; --warn-soft:#FAEFDF; --ok:#1C7448; --ok-soft:#E0F2E8; --bad:#B32218; --bad-soft:#FAE5E3;
  --violet:#6A3FB5; --violet-soft:#EEE7FA;
  --font-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rail:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131A; --surface:#151B24; --surface2:#1C2430; --ink:#E1E7EF; --ink2:#A2AEBE; --line:#2B3543;
    --accent:#86A6FF; --accent-soft:#1B2747; --accent-ink:#B7C9FF;
    --warn:#E6A956; --warn-soft:#2C2214; --ok:#62CB98; --ok-soft:#13281D; --bad:#F38C82; --bad-soft:#331715;
    --violet:#B89BF0; --violet-soft:#251C38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131A; --surface:#151B24; --surface2:#1C2430; --ink:#E1E7EF; --ink2:#A2AEBE; --line:#2B3543;
  --accent:#86A6FF; --accent-soft:#1B2747; --accent-ink:#B7C9FF;
  --warn:#E6A956; --warn-soft:#2C2214; --ok:#62CB98; --ok-soft:#13281D; --bad:#F38C82; --bad-soft:#331715;
  --violet:#B89BF0; --violet-soft:#251C38;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.65;
  -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
::selection{background:var(--accent-soft)}

/* ---------- top bar (mobile) and rail ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:none;align-items:center;gap:12px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:var(--font-ui);font-size:15px}
.topbar .tb-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.btn{font-family:var(--font-ui);font-size:14px;font-weight:500;color:var(--ink);background:var(--surface2);border:1px solid var(--line);
  border-radius:3px;padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  font-family:var(--font-ui);font-size:14px;line-height:1.4;z-index:25}
.rail .brand{display:block;text-decoration:none;color:var(--ink);margin-bottom:18px}
.rail .brand b{display:block;font-size:17px;letter-spacing:.01em}
.rail .brand span{display:block;font-family:var(--font-mono);font-size:11.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.rail .grp{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);margin:16px 0 6px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail a.ch{display:grid;grid-template-columns:34px 1fr auto;gap:4px;align-items:baseline;text-decoration:none;color:var(--ink);padding:5px 8px;border-radius:3px}
.rail a.ch .n{font-family:var(--font-mono);font-size:12px;color:var(--ink2)}
.rail a.ch .tick{font-size:12px;color:var(--ok)}
.rail a.ch:hover{background:var(--surface2)}
.rail a.ch.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail .secs{margin:4px 0 8px 42px;padding:0;list-style:none;border-left:1px solid var(--line)}
.rail .secs a{display:block;padding:3px 8px 3px 10px;color:var(--ink2);text-decoration:none;font-size:13px}
.rail .secs a:hover{color:var(--accent-ink)}
.rail .theme{margin-top:20px;display:flex;gap:6px;flex-wrap:wrap}
.rail .theme .btn{font-size:12px;padding:4px 9px}
.scrim{display:none}

/* ---------- main column ---------- */
main{margin-left:var(--rail);padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chapter{max-width:72ch;margin:0 auto}
.chapter[hidden]{display:none!important}
@media (max-width:1060px){
  .topbar{display:flex}
  .rail{transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 0 rgba(0,0,0,0)}
  .rail.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,20,.38);z-index:24}
  main{margin-left:0;padding-block:24px 64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* title block (chapter opener) */
.titleblock{border:1.5px solid var(--ink);display:grid;grid-template-columns:1fr auto;margin:0 0 30px;background:var(--surface)}
.titleblock .tb-main{padding:18px 20px 16px;border-right:1.5px solid var(--ink);min-width:0}
.titleblock .tb-kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.titleblock h1{font-family:var(--font-ui);font-weight:600;font-size:clamp(1.65rem,3.4vw,2.3rem);line-height:1.15;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.titleblock .tb-sub{font-size:16px;color:var(--ink2);margin:6px 0 0;line-height:1.5}
.titleblock .tb-side{display:grid;grid-template-rows:auto 1fr;min-width:120px}
.titleblock .tb-side div{padding:8px 14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.titleblock .tb-side div+div{border-top:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:0;color:var(--accent);font-weight:600;text-transform:none}
@media (max-width:520px){.titleblock{grid-template-columns:1fr}.titleblock .tb-main{border-right:0;border-bottom:1.5px solid var(--ink)}
  .titleblock .tb-side{grid-template-rows:none;grid-template-columns:1fr auto}.titleblock .tb-side div+div{border-top:0;border-left:1.5px solid var(--ink);font-size:24px}}

.lede{font-size:1.08em;line-height:1.7}
.chapter h2{font-family:var(--font-ui);font-weight:600;font-size:1.48rem;line-height:1.25;margin:2.6em 0 .6em;text-wrap:balance;letter-spacing:-.005em;
  padding-top:.7em;border-top:1px solid var(--line)}
.chapter h2 .sn,.chapter h3 .sn{font-family:var(--font-mono);font-weight:500;color:var(--accent);font-size:.78em;margin-right:.55em;letter-spacing:0}
.chapter h3{font-family:var(--font-ui);font-weight:600;font-size:1.14rem;line-height:1.3;margin:2em 0 .5em;text-wrap:balance}
.chapter h4{font-family:var(--font-ui);font-weight:600;font-size:1rem;margin:1.6em 0 .3em}
.chapter p{margin:0 0 1em}
.chapter ul,.chapter ol{margin:0 0 1em;padding-left:1.4em}
.chapter li{margin:.25em 0}
.chapter li>ul,.chapter li>ol{margin:.25em 0}
dfn{font-style:italic;font-weight:600}
strong{font-weight:600}
code,kbd,samp{font-family:var(--font-mono);font-size:.84em;background:var(--surface2);padding:.08em .32em;border-radius:2px;overflow-wrap:anywhere}
pre{font-family:var(--font-mono);font-size:14px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 16px;overflow-x:auto;margin:0 0 1.2em;tab-size:2}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
pre .c{color:var(--ink2);font-style:italic}
pre .k{color:var(--accent-ink);font-weight:600}
pre .s{color:var(--ok)}
pre .hl{background:var(--warn-soft);display:inline-block;min-width:100%}
.small{font-size:.9em}
.muted{color:var(--ink2)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}

/* ---------- callout boxes ---------- */
.box{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:14px 18px 6px;margin:1.4em 0}
.box::before{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.box[data-label]::before{content:attr(data-label)!important}
.box>:last-child{margin-bottom:10px}
.box.def{border-color:var(--accent);background:var(--accent-soft)}
.box.def::before{content:"Definition";color:var(--accent-ink)}
.box.key{border-color:var(--ink);border-width:1.5px}
.box.key::before{content:"Key idea";color:var(--ink)}
.box.warn{border-color:var(--warn);background:var(--warn-soft)}
.box.warn::before{content:"Exam trap";color:var(--warn)}
.box.note{background:var(--surface2)}
.box.note::before{content:"Aside"}
.box.ex{border-style:dashed;border-color:var(--ink2)}
.box.ex::before{content:"Worked example";color:var(--ink)}
.box.exam{border-color:var(--violet);background:var(--violet-soft)}
.box.exam::before{content:"Exam angle";color:var(--violet)}
.box.ok{border-color:var(--ok);background:var(--ok-soft)}
.box.ok::before{content:"Good practice";color:var(--ok)}
.box.read{border-color:var(--ok);background:var(--ok-soft)}
.box.read::before{content:"Further reading in your textbooks";color:var(--ok)}
.box.read ul{margin-bottom:.4em}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:.4em 0}
.step>b{font-family:var(--font-mono);font-size:.8em;color:var(--accent);padding-top:.2em;white-space:nowrap}
.step>div{min-width:0}
.ans{font-family:var(--font-ui);font-weight:600}

/* equations */
.eq{font-family:var(--font-body);font-size:1.12em;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin:1em 0 1.2em;overflow-x:auto;line-height:1.5}
.eq i,.m i{font-style:italic}
.eq .lbl{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.m{font-family:var(--font-body);white-space:nowrap}
sub,sup{font-size:.72em;line-height:0}

/* tables */
.tw{overflow-x:auto;margin:1em 0 1.4em;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:8px 11px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.02em;background:var(--surface2);color:var(--ink)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td code{font-size:.82em}
table.glossary td:first-child{font-weight:600;white-space:nowrap;font-family:var(--font-ui);font-size:14.5px}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.y{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tag.n{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tag.w{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

/* figures */
figure.fig{margin:1.6em 0;padding:0}
figure.fig .canvas{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px;overflow-x:auto}
figure.fig svg{display:block;width:100%;height:auto;max-width:100%}
@media (max-width:600px){ figure.fig .canvas svg{min-width:540px} }
figure.fig figcaption{font-family:var(--font-ui);font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.45}
figure.fig figcaption b{color:var(--ink);font-weight:600}
svg text{font-family:var(--font-ui);fill:var(--ink)}
svg .t-s{font-size:12px} svg .t-m{font-size:13.5px} svg .t-l{font-size:15px;font-weight:600}
svg .t-mono{font-family:var(--font-mono);font-size:12px}
svg .t-mute{fill:var(--ink2)} svg .t-acc{fill:var(--accent-ink)} svg .t-bad{fill:var(--bad)} svg .t-ok{fill:var(--ok)} svg .t-warn{fill:var(--warn)}
svg .bx{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
svg .bx2{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
svg .bx-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .bx-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.3}
svg .bx-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.3}
svg .bx-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.3}
svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
svg .ln-mute{stroke:var(--ink2);stroke-width:1.2;fill:none;stroke-dasharray:4 4}
svg .ln-acc{stroke:var(--accent);stroke-width:1.8;fill:none}
svg .ln-bad{stroke:var(--bad);stroke-width:1.6;fill:none}
svg .ln-ok{stroke:var(--ok);stroke-width:1.6;fill:none}
svg .grid{stroke:var(--line);stroke-width:1;fill:none}
svg .fill-acc{fill:var(--accent)} svg .fill-bad{fill:var(--bad)} svg .fill-ok{fill:var(--ok)} svg .fill-ink{fill:var(--ink)} svg .fill-mute{fill:var(--ink2)}
svg .area-acc{fill:var(--accent-soft);stroke:none}

/* simple HTML flow diagrams */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:1em 0;font-family:var(--font-ui);font-size:14px}
.flow .nd{border:1.3px solid var(--ink);background:var(--surface);padding:6px 10px;border-radius:2px;line-height:1.3}
.flow .nd small{display:block;color:var(--ink2);font-size:12px}
.flow .nd.acc{border-color:var(--accent);background:var(--accent-soft)}
.flow .nd.bad{border-color:var(--bad);background:var(--bad-soft)}
.flow .nd.ok{border-color:var(--ok);background:var(--ok-soft)}
.flow .ar{color:var(--ink2);font-family:var(--font-mono)}

/* self-check */
details.check{border:1px solid var(--line);background:var(--surface);border-radius:2px;margin:.7em 0;padding:0}
details.check>summary{cursor:pointer;list-style:none;padding:11px 16px 11px 40px;position:relative;font-family:var(--font-ui);font-size:15.5px;font-weight:500;line-height:1.45}
details.check>summary::-webkit-details-marker{display:none}
details.check>summary::before{content:"?";position:absolute;left:12px;top:11px;width:19px;height:19px;border:1.3px solid var(--accent);color:var(--accent);
  border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
details.check[open]>summary::before{content:"✓";background:var(--accent);color:var(--surface)}
details.check>div{padding:2px 18px 6px 40px;border-top:1px dashed var(--line)}
details.check>div>:first-child{margin-top:.8em}
.checks-h{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);margin:2.2em 0 .4em}

/* interactive widgets */
.widget{border:1.5px solid var(--accent);border-radius:3px;background:var(--surface);margin:1.8em 0;overflow:hidden}
.widget>.w-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent)}
.widget>.w-head b{font-family:var(--font-ui);font-size:15px;color:var(--accent-ink)}
.widget>.w-head span{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.widget>.w-body{padding:14px 16px 16px;font-family:var(--font-ui);font-size:15px;line-height:1.5}
.w-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.w-row label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.w-row input[type=number],.w-row input[type=text],.w-row select{font-family:var(--font-mono);font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);width:7.5em}
.w-row input[type=text]{width:16em;max-width:100%}
.w-row input[type=range]{width:180px;max-width:100%;accent-color:var(--accent)}
.w-out{font-family:var(--font-mono);font-size:14px;background:var(--surface2);border-radius:2px;padding:10px 12px;line-height:1.6;overflow-x:auto}
.w-out b{color:var(--accent-ink)}
.w-msg{font-size:14.5px;margin:8px 0 0;min-height:1.4em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{font-family:var(--font-ui);font-size:13.5px;padding:6px 11px;border:0;background:var(--surface2);color:var(--ink);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--surface)}
.pill{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.pill.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.pill.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

/* chapter footer */
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:3em;padding-top:1.2em;border-top:1.5px solid var(--ink);font-family:var(--font-ui)}
.ch-foot .mid{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.ch-foot a.nav{font-size:14.5px;text-decoration:none;max-width:44%}
.ch-foot a.nav small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:560px){.ch-foot a.nav{max-width:100%}}

/* highlight-to-explain */
.ask-btn{position:fixed;z-index:45;transform:translate(-50%,-100%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.ask-btn{display:flex;align-items:stretch;gap:6px}
.ask-btn .btn{font-size:13px;padding:5px 11px;white-space:nowrap}
.ask-custom{display:flex;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ask-custom:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ask-custom input{width:250px;max-width:calc(100vw - 190px);min-width:90px;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--font-ui);font-size:13px;padding:5px 9px}
.ask-custom .btn{border:0;border-left:1px solid var(--line);border-radius:0;padding:5px 10px}
::highlight(ask-sel){background-color:var(--accent-soft);color:inherit}
.ask-card{position:fixed;z-index:46;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(400px,calc(100vw - 32px));max-height:min(62vh,560px);overflow:auto;background:var(--surface);color:var(--ink);
  border:1.5px solid var(--accent);border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.22);font-family:var(--font-ui);font-size:15px;line-height:1.55}
