allow_remote_control yes

shell_integration no-sudo

listen_on unix:/tmp/kitty

# Kitty theme (managed by kitty +kitten themes)
# include ~/.config/kitty/active-theme.conf

term xterm-kitty

font_size 15

# JetBrainsMono not installed; using MesloLGM Nerd Font Mono instead
# font_family      JetBrainsMono Nerd Font Mono
font_family      MesloLGM Nerd Font Mono

scrollback_lines 10000

# Hold Shift while dragging inside a terminal app such as Neovim. Kitty then
# owns the selection and copies it directly to the macOS clipboard.
copy_on_select clipboard
mouse_hide_wait -1

shell zsh --login

editor nvim

# Open LazyVim in a new Kitty tab at the current working directory.
# kitty_mod is Cmd+Option in this config.
map kitty_mod+e launch --type=tab --cwd=current nvim .

hide_window_decorations titlebar-only

window_padding_width 1 5 2 2

window_margin_width 10
window_border_width 1pt
# active_border_color #44ffff
confirm_os_window_close 0

enable_audio_bell no

macos_option_as_alt right

cursor_shape beam
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_stop_blinking_after 0

cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

background_opacity 0.7
background_blur 20

tab_bar_edge top
tab_bar_style powerline

kitty_mod cmd+option

map ctrl+cmd+option+u goto_layout tall
map ctrl+cmd+option+i goto_layout fat
map ctrl+cmd+option+o goto_layout stack
map kitty_mod+z toggle_layout stack

tab_title_template "{session_name or tab.active_wd.rsplit('/', 1)[-1]}"

shell_integration no-title

map ctrl+cmd+,   load_config_file

map cmd+enter new_window
# Cmd+C copies Neovim's visual selection, or a native Kitty selection made
# with Shift+drag. F29 is an internal bridge key handled by Neovim.
map cmd+c kitten pass_keys.py copy f29 "n?vim"
# Neovim handles F30 according to its current mode; other programs receive a
# normal Kitty clipboard paste.
map cmd+v kitten pass_keys.py paste f30 "n?vim"
# macOS Option+Delete convention: delete the previous word in shells and in
# Neovim Insert mode (both interpret Ctrl+W this way).
map alt+backspace send_text all \x17
# macOS Cmd+Delete convention: delete from the cursor to the start of the line
# in shells and in Neovim Insert mode (both interpret Ctrl+U this way).
map cmd+backspace send_text all \x15
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map shift+left send_text all \x1b[1;2D
map shift+right send_text all \x1b[1;2C
map shift+alt+left send_text all \x1b[1;4D
map shift+alt+right send_text all \x1b[1;4C
map shift+cmd+left send_text all \x1b[1;10D
map shift+cmd+right send_text all \x1b[1;10C
map ctrl+shift+l next_window
map ctrl+shift+h previous_window

# vim-kitty-navigator integration (knubie/vim-kitty-navigator)
map ctrl+j kitten pass_keys.py bottom ctrl+j "nvim"
map ctrl+k kitten pass_keys.py top    ctrl+k "nvim"
map ctrl+h kitten pass_keys.py left   ctrl+h "nvim"
map ctrl+l kitten pass_keys.py right  ctrl+l "nvim"

map ctrl+cmd+h swap_with_window

map ctrl+cmd+option+h show_scrollback
map ctrl+cmd+option+l resize_window wider
map ctrl+cmd+option+k resize_window taller
map ctrl+cmd+option+j resize_window shorter 3

map kitty_mod+w close_window

# Quick access terminals
map kitty_mod+a>d launch --type=background kitten quick-access-terminal
map kitty_mod+a>c launch --type=background kitten quick-access-terminal --config ~/.config/kitty/quick-access-terminal-center.conf --instance-group colorscheme-selector


##############################################################################
#      Kitty Sessions (tmux replacement)                                     #
##############################################################################

map ctrl+shift+s save_as_session --use-foreground-process --relocatable

startup_session $HOME/.config/kitty/sessions/home.kitty-session

# Session switching (ctrl+b prefix like tmux)
map ctrl+b>d goto_session $HOME/.config/kitty/sessions/dotfiles.kitty-session
map ctrl+b>o goto_session $HOME/.config/kitty/sessions/obsidian.kitty-session
map ctrl+b>1 goto_session $HOME/.config/kitty/sessions/networking.kitty-session
map ctrl+b>h goto_session $HOME/.config/kitty/sessions/home.kitty-session
map ctrl+b>b goto_session $HOME/.config/kitty/sessions/blogpost.kitty-session
map ctrl+b>p goto_session $HOME/.config/kitty/sessions/dots-private.kitty-session
map ctrl+b>a goto_session $HOME/.config/kitty/sessions/lua.kitty-session
map ctrl+b>k goto_session $HOME/.config/kitty/sessions/skitty.kitty-session
map ctrl+b>; goto_session $HOME/.config/kitty/sessions/scripts.kitty-session
map ctrl+b>g goto_session $HOME/.config/kitty/sessions/toucan.kitty-session

# Switch to previous/alternate session
map ctrl+b>l goto_session -1

action_alias launch_session_select launch --type=overlay /bin/zsh -c "$HOME/.config/kitty/scripts/kitty-list-sessions.sh"
map ctrl+b>s launch_session_select

action_alias launch_zoxide_session launch --type=overlay /bin/zsh -c "$HOME/.config/kitty/scripts/kitty-zoxide-session.sh"
map ctrl+b>z launch_zoxide_session

# Browse and select from known sessions
map ctrl+b>n goto_session

tab_bar_min_tabs 1

# Only show tabs from the currently active session
tab_bar_filter session:~ or session:^$

map cmd+t new_tab_with_cwd


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
