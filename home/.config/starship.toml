"$schema" = "https://starship.rs/config-schema.json"

# Compact powerline prompt matching Kitty's existing Catppuccin tab colors.
add_newline = false
palette = "catppuccin_mocha"
format = "$directory($git_branch$git_status[ ](bg:mauve)[](fg:mauve))$line_break$character"
right_format = ""

[directory]
style = "fg:text bg:mantle"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
home_symbol = "~"
read_only = " "

[git_branch]
symbol = " "
style = "fg:crust bg:mauve"
format = "[](fg:mantle bg:mauve)[ $symbol$branch]($style)"

[git_status]
style = "fg:crust bg:mauve"
format = "([ $all_status$ahead_behind]($style))"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
staged = "+$count"
modified = "~$count"
untracked = "?$count"
deleted = "-$count"
renamed = "»$count"
conflicted = "!$count"
stashed = ""

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[palettes.catppuccin_mocha]
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
text = "#cdd6f4"
blue = "#89b4fa"
mauve = "#cba6f7"
yellow = "#f9e2af"
green = "#a6e3a1"
red = "#f38ba8"
